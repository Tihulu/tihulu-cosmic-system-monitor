name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake libegl1-mesa-dev libexpat1-dev libfontconfig-dev \
            libfreetype-dev libwayland-dev libxkbcommon-dev pkgconf
      - name: Format workspace
        run: cargo fmt --all
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Release build
        run: cargo build --release
      - name: Validate read-only QA sampler shell syntax
        run: bash -n scripts/sample-cosmic-memory.sh
      - name: Verify pinned quick-install REF archive checkout (no installation)
        env:
          INSTALL_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # quick-install.sh uses /archive/${REF}.tar.gz, not git checkout.
          # Prove the exact candidate SHA archive can be obtained and contains
          # the same source and installer, without running sudo/install.
          test -n "$INSTALL_REF"
          source_dir="$(mktemp -d)"
          trap 'rm -rf "$source_dir"' EXIT
          curl -fL --retry 3 --silent --show-error \
            "https://github.com/${GITHUB_REPOSITORY}/archive/${INSTALL_REF}.tar.gz" \
            | tar -xz -C "$source_dir" --strip-components=1
          # cargo fmt above may edit the working tree; compare against the
          # immutable checkout commit rather than formatted workspace bytes.
          git show HEAD:src/app.rs | cmp - "$source_dir/src/app.rs"
          git show HEAD:Cargo.toml | cmp - "$source_dir/Cargo.toml"
          git show HEAD:scripts/quick-install.sh | cmp - "$source_dir/scripts/quick-install.sh"
          grep -F 'REF="${REF:-stable}"' "$source_dir/scripts/quick-install.sh"

  promote-stable:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote only the current verified main HEAD
        run: |
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [ "$CURRENT_MAIN" != "$GITHUB_SHA" ]; then
            echo "A newer main commit exists; skipping stable promotion for $GITHUB_SHA"
            exit 0
          fi
          git push --force origin "${GITHUB_SHA}:refs/heads/stable"
