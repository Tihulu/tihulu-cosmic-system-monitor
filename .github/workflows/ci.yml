name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake libegl1-mesa-dev libexpat1-dev libfontconfig-dev \
            libfreetype-dev libwayland-dev libxkbcommon-dev pkgconf
      - name: Format workspace
        run: cargo fmt --all
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets

  promote-stable:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote CI-verified commit to stable
        run: git push --force origin "${GITHUB_SHA}:refs/heads/stable"
